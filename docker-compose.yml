version: '3.8'

services:
  app:
    image: ghcr.io/ssams32/mentalhealt:latest
    build: .
    container_name: referral-system-v3
    ports:
      - "3000:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - ATTACHMENTS_DIR=/app/attachments
      - TZ=Asia/Seoul
    volumes:
      - /volume2/docker/imhc/app/data:/app/data
      - /volume2/docker/imhc/app/attachments:/app/attachments
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE="0 0 0 * * *"
      # GHCR 이미지가 공개(public)라 인증 없이 pull 가능 — REPO_USER/REPO_PASS 불필요 (2026-10-21 제거)
    restart: always

networks:
  default:
    name: imhc-network
