version: '3.8'

services:
  app:
    image: ghcr.io/ssams32/mentalhealt:latest
    build: .
    container_name: referral-system-v3
    ports:
      - "3000:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - ATTACHMENTS_DIR=/app/attachments
      - TZ=Asia/Seoul
      # [백업 대상 지정 예시] 데이터 관리 화면에서 고를 백업 대상 (최대 3개, 필요할 때만 주석 해제)
      # - BACKUP_TARGET_1_NAME=volume1 시점 백업
      # - BACKUP_TARGET_1_PATH=/app/external-backup/volume1
      # - BACKUP_TARGET_1_HOST_PATH=/volume1/의뢰대장-시점백업
      # - BACKUP_TARGET_2_NAME=USB 드라이브
      # - BACKUP_TARGET_2_PATH=/app/external-backup/usb
      # - BACKUP_TARGET_2_HOST_PATH=/volumeUSB1/usbshare
      # - BACKUP_TARGET_2_MARKER=.imhc-backup-target
    volumes:
      - /volume2/docker/imhc/app/data:/app/data
      - /volume2/docker/imhc/app/attachments:/app/attachments
      # [백업 대상 볼륨 예시] 위 BACKUP_TARGET_N_PATH와 짝을 맞춰 주석 해제
      # - /volume1/의뢰대장-시점백업:/app/external-backup/volume1
      # - /volumeUSB1/usbshare:/app/external-backup/usb
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE="0 0 0 * * *"
      # GHCR 이미지가 공개(public)라 인증 없이 pull 가능 — REPO_USER/REPO_PASS 불필요 (2026-10-21 제거)
    restart: always

networks:
  default:
    name: imhc-network
