name: Antigravity Code Review

on:
  pull_request:
    paths:
      - 'server.js'
      - 'app/data/**'
      - 'scripts/**'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Start Backend Server
        run: node server.js &
        
      - name: Wait for Server
        run: sleep 5
        
      - name: Run ISP Evaluation TDD
        run: node scripts/test_isp_achievement.mjs
        
      - name: Claude Proactive Review
        run: |
          npx @anthropic-ai/claude-code -p "Review the changes in this PR. Focus on the ISP Evaluation logic and ensure the business rules are correctly implemented. Result of TDD: $(node scripts/test_isp_achievement.mjs)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
