<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSE 작성 보조 도구</title>
<link rel="stylesheet" href="productivity.css">
<style>
/* ===========================================================
   MSE 작성 보조 도구 — 화면 스타일
   색 4개만 사용 (구현계획서 8.4)
   =========================================================== */
:root{
  --bg:#FFFFFF;
  --ink:#222222;
  --accent:#1F4E79;   /* 이상 옵션 선택 / 현재 섹션 */
  --danger:#B3261E;   /* 위험 · 미입력 */
  --muted:#E6E8EB;    /* 기본 옵션 · 미확인 */
  --line:#D6D9DE;   /* 얇은 구분선 */
  --dim:#4F555C;    /* 흐린 글자 */
  --tint:#F5F7F9;   /* 아주 옅은 바탕 */
  --fs:17px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%; font-size:var(--fs)}
body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:1rem; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit; font-size:inherit; color:inherit}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit}

/* ---- 상단 머리글 ---- */
.top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:10px 18px; border-bottom:1px solid var(--line);
}
.top h1{margin:0; font-size:1.2rem; font-weight:700; letter-spacing:-0.01em}
.top .spacer{flex:1}
.fontctl{display:flex; gap:4px; align-items:center}
.fontctl button{
  border:1px solid var(--line); background:#fff; border-radius:4px;
  padding:2px 8px; cursor:pointer; line-height:1.2;
}

/* ---- 3단 배치 ---- */
.top{flex:0 0 auto}
.tocsel{flex:0 0 auto}
.layout{
  display:grid;
  grid-template-columns:180px minmax(0,1fr) 400px;
  flex:1 1 auto;
  min-height:0;          /* 이게 있어야 안쪽이 제대로 스크롤됨 */
}
nav.toc{border-right:1px solid var(--line); overflow-y:auto; padding:16px 0}
main.form{overflow-y:auto; padding:8px 34px 60vh 34px}
aside.result{border-left:1px solid var(--line); overflow-y:auto; padding:14px 16px 40px 16px; background:var(--tint)}

/* ---- 목차 ---- */
.toc ol{list-style:none; margin:0; padding:0}
.toc li a{
  display:block; padding:5px 14px 5px 16px; text-decoration:none; color:var(--ink);
  font-size:1rem; border-left:3px solid transparent; cursor:pointer;
}
.toc li a:hover{background:var(--tint)}
.toc li a.current{border-left-color:var(--accent); color:var(--accent); font-weight:700}
.toc .tick{display:inline-block; width:1.1em; color:var(--accent)}
.toc .tick.off{color:var(--muted)}
.tocsel{display:none}

/* ---- 섹션 ---- */
section.sec{padding:30px 0 10px 0; border-top:1px solid var(--line)}
section.sec:first-child{border-top:0}
.sec > h2{
  margin:0 0 4px 0; font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.sec .mustmark{color:var(--danger); font-size:.88rem; font-weight:600}
.grp{margin:16px 0 0 0}
.grp > .lab{font-size:1rem; font-weight:600; color:var(--ink); margin-bottom:7px; display:flex; align-items:center; gap:6px}
.opts{display:flex; flex-wrap:wrap; gap:6px}

/* ---- 옵션 버튼 ---- */
.opt{
  border:1px solid var(--line); background:#fff; border-radius:5px;
  padding:7px 13px; cursor:pointer; font-size:1rem; line-height:1.4;
  display:inline-flex; align-items:center; gap:5px;
}
.opt:hover{border-color:var(--dim)}
.opt.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
/* 기본(정상) 옵션이 선택된 상태 — 색만이 아니라 테두리·굵기로도 구분되게 함 */
.opt.on.plain{background:var(--muted); border-color:var(--dim); color:var(--ink); font-weight:600}
.opt .en{font-size:.86em; opacity:.72}
.optwrap{display:inline-flex; align-items:center; gap:3px}
.opt .defmark{font-size:.75em; color:var(--dim)}
.opt.on .defmark{color:inherit; opacity:.9}
.opt:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

/* ---- 펼침 ---- */
.reveal{
  margin:8px 0 0 12px; padding:10px 0 2px 14px; border-left:2px solid var(--muted);
}
.frame{margin:8px 0 0 12px; padding:10px 14px 12px 14px; border-left:2px solid var(--accent); background:var(--tint)}
.frame > .fh{font-size:.98rem; color:var(--accent); font-weight:700; margin-bottom:6px; display:flex; gap:8px; align-items:center}

/* ---- 입력 ---- */
input[type=text],input[type=date],textarea{
  width:100%; border:1px solid var(--line); border-radius:5px; padding:6px 9px; background:#fff;
}
input[type=date]{width:auto; min-width:12em}
textarea{resize:vertical; min-height:2.6em}
select{border:1px solid var(--line); border-radius:5px; padding:5px 8px; background:#fff}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px}
.chip{
  border:1px dashed var(--line); background:#fff; border-radius:12px;
  padding:4px 12px; font-size:.94rem; cursor:pointer; color:var(--ink);
}
.chip:hover{border-style:solid; color:var(--ink)}

/* ---- 작은 버튼 ---- */
.ibtn{
  border:1px solid var(--line); background:#fff; border-radius:50%; width:24px; height:24px;
  font-size:.85rem; line-height:1; cursor:pointer; color:var(--dim); padding:0;
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.ibtn:hover{color:var(--accent); border-color:var(--accent)}
.tbtn{border:1px solid var(--line); background:#fff; border-radius:5px; padding:5px 12px; font-size:.92rem; cursor:pointer}
.tbtn:hover{border-color:var(--dim)}
.tbtn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.tbtn.primary:hover{opacity:.92}
/* [v2.0] MHIS 옮겨 적기 안내 창 */
.tr-tab{margin:0 0 4px 0; font-weight:700; color:var(--accent)}
.tr-lead{margin:0 0 8px 0}
.tr-box{border:1px solid var(--line); background:var(--tint); padding:10px 12px; white-space:pre-wrap; word-break:break-word; line-height:1.7; max-height:40vh; overflow:auto}
.tr-bar{display:flex; gap:8px; align-items:center; margin-top:12px}
.confirm{
  margin:18px 0 4px 0; border:1px solid var(--line); background:#fff; border-radius:5px;
  padding:8px 16px; cursor:pointer; font-size:1rem;
}
.confirm.must{border-color:var(--danger); color:var(--danger)}
.confirm.done{background:var(--muted); border-color:var(--line); color:var(--dim)}

/* ---- 질문 보기 패널 ---- */
.qpanel{
  margin:10px 0 0 0; padding:14px 18px; background:var(--tint); border-left:3px solid var(--accent);
  font-size:1.18rem; line-height:1.75;
}
.qpanel ul{margin:4px 0 0 0; padding-left:1.1em}
.qpanel li{margin:3px 0}

/* ---- 결과 패널 ---- */
.rhead{
  display:flex; align-items:center; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--line);
  position:sticky; top:-14px; background:var(--tint); z-index:2; padding-top:2px;
}
.rcount{font-size:.98rem; color:var(--dim)}
.rcount.bad{color:var(--danger); font-weight:700}
.rcard{padding:11px 0; border-bottom:1px solid var(--line)}
.rcard h3{margin:0 0 5px 0; font-size:1.02rem; font-weight:700; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.rcard.unconf{color:var(--dim)}
.rcard.unconf .chk,.rcard.unconf textarea{color:var(--dim)}
.badge{font-size:.8rem; border:1px solid var(--line); border-radius:9px; padding:1px 8px; color:var(--dim); font-weight:400}
.badge.warn{border-color:var(--danger); color:var(--danger)}
.chk{font-size:1rem; margin:3px 0 5px 0; white-space:pre-wrap; word-break:break-word}
.chk .miss{color:var(--danger); font-weight:700}
.slot{margin-top:5px}
.slot .sl{font-size:.88rem; color:var(--dim)}
.slot textarea{font-size:1.02rem; line-height:1.7; min-height:3.2em}
.slotbar{display:flex; gap:6px; align-items:center; margin-top:3px}
.alert{
  background:var(--tint); border-left:3px solid var(--danger); color:var(--danger);
  padding:7px 12px; font-size:.96rem; margin:5px 0; font-weight:700;
}
/* [v2.1] 예시 대상자 안내 띠 — 경고(붉은 띠)와 구분되는 노란 띠 */
.note{
  background:#fff8e1; border-left:3px solid #b8860b; color:#5c4400;
  padding:7px 12px; font-size:.96rem; margin:8px 0 4px 0; font-weight:700;
}
.rfoot{display:flex; gap:6px; flex-wrap:wrap; padding-top:12px}
.rfoot .tbtn{padding:6px 12px}
.ver{margin-top:14px; font-size:.84rem; color:var(--dim)}

/* ---- 대화상자 ---- */
dialog{
  border:1px solid var(--line); border-radius:6px; padding:0; max-width:640px; width:92%;
  color:var(--ink); background:#fff;
}
dialog::backdrop{background:rgba(0,0,0,.28)}
.dlg{padding:18px 22px 20px 22px; max-height:78vh; overflow-y:auto}
.dlg h4{margin:0 0 10px 0; font-size:1.02rem}
.dlg h5{margin:14px 0 3px 0; font-size:.88rem; color:var(--accent)}
.dlg p,.dlg li{font-size:.93rem; margin:3px 0}
.dlg ul{margin:2px 0; padding-left:1.15em}
.dlgfoot{display:flex; justify-content:flex-end; gap:8px; padding:0 22px 16px 22px}

/* ---- 1024px 미만 ---- */
@media (max-width:1023px){
  .layout{display:block; height:auto}
  nav.toc{display:none}
  .tocsel{display:block; padding:8px 14px; border-bottom:1px solid var(--line)}
  .tocsel select{width:100%}
  main.form{overflow:visible; padding:4px 14px 60vh 14px}
  body{display:block}
  aside.result{
    position:fixed; left:0; right:0; bottom:0; max-height:52vh; border-left:0; border-top:1px solid var(--line);
    box-shadow:0 -1px 0 rgba(0,0,0,.06); z-index:5; padding-top:0;
  }
  aside.result.folded{max-height:44px; overflow:hidden}
  .rhead{position:static}
}
.foldbtn{display:none}
@media (max-width:1023px){ .foldbtn{display:inline-flex} }

@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
/* v2.3: compact review controls and readable panel hierarchy */

.top{background:#f5f8fb;padding:12px 18px}
.rhead{flex-wrap:wrap;gap:6px}
.rhead .rcount{flex-basis:100%}
.rcard{border-radius:8px;background:white;padding:12px;margin-top:14px;border:1px solid var(--line)}
.rfoot{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:-40px;background:var(--tint);padding:12px 0}
button:disabled{opacity:.55;cursor:default}
.review-row{padding:12px 0;border-bottom:1px solid var(--line)}
.review-row p{margin:6px 0}
details{margin:12px 0} summary{cursor:pointer;color:var(--accent);font-weight:600}
.copy-status{min-height:1.7em;font-weight:600}
.tr-bar{flex-wrap:wrap}
@media(min-width:1024px) and (max-width:1350px){.layout{grid-template-columns:145px minmax(0,1fr) 355px}main.form{padding-left:20px;padding-right:20px}}
@media(max-width:1023px){
  .rhead .rcount{flex-basis:auto}.rhead{position:sticky;top:0;align-items:center;padding:5px 0}
  .rhead .foldbtn{margin-right:auto}.rfoot{bottom:-40px}.top{gap:4px}
  aside.result.folded .rhead > button:not(.foldbtn), aside.result.folded .rhead > span:not(.rcount){display:none}
}
/* v2.4: independently scrolling input/results, persistent controls. */

.top h1{font-size:1.12rem;letter-spacing:-.035em}

.toc li a.current{background:#e8f0f7}
main.form{padding:0 26px 45vh;scroll-padding-top:82px;overflow-anchor:none}
.formbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);background:#fff}

.formbar .tbtn{padding:5px 9px;font-size:.8rem}

.sec>h2{font-size:1.16rem;gap:8px;letter-spacing:-.025em}
.grp{margin-top:18px}
.grp>.lab{font-size:.94rem;margin-bottom:8px}
.opts{gap:7px}
.opt{padding:8px 12px;border-radius:7px;line-height:1.4;font-size:.95rem;min-height:39px}
.opt:hover{background:#f2f6fa;border-color:#849aae}
.opt.on:hover{background:var(--accent);color:white}
.opt.on.plain{background:#eaf0f5;border-color:#8196aa}
.opt.on.plain:hover{background:#e1eaf2;color:var(--ink)}
.opt .en{font-size:.81em}.opt .defmark{font-size:.7em}

.section-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:18px 0 6px}
.section-actions .confirm{margin:0;font-size:.91rem;padding:7px 12px}

aside.result{display:flex;flex-direction:column;overflow:hidden;padding:0;background:var(--tint);min-height:0}
.rhead{position:static;padding:13px 16px 11px;display:block;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--tint)}
.rhead-status{display:flex;align-items:center;gap:8px;min-height:28px}
.rhead .rcount{flex:1;font-size:.91rem;white-space:nowrap}
.rhead-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rhead-actions button:first-child{margin-right:auto}
.review-progress{display:block;appearance:none;width:100%;height:4px;margin:7px 0 0;border:0;border-radius:5px;background:#dde5ee;color:var(--accent)}
.review-progress::-webkit-progress-bar{background:#dde5ee;border-radius:5px}
.review-progress::-webkit-progress-value{background:var(--accent);border-radius:5px}
.result-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:0 14px 16px;overscroll-behavior:contain;scroll-padding-top:12px;overflow-anchor:none}
.rcard{padding:13px 14px;border-radius:9px;margin:12px 0 0;box-shadow:0 1px 2px #12304a05}
.rcard.current-result{border-color:#8faec5;box-shadow:inset 3px 0 var(--accent)}
.rcard h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 9px;font-size:.94rem}
.result-title{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;cursor:pointer;padding:0;text-align:left}
.result-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.badge{font-size:.69rem;padding:1px 6px;background:#f5f7fa}.edited-badge{color:var(--accent);border-color:#9db6c9}
.chk{font-size:.84rem;line-height:1.65}.sl{font-size:.8rem;color:var(--dim);margin:6px 0}
.slot textarea{width:100%;font-size:.89rem;line-height:1.75;resize:vertical;min-height:62px;transition:none}
.slotbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.slotbar .tbtn{font-size:.75rem;min-height:30px;padding:3px 7px}
.char-count{margin-left:auto;font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
.edit-warning{font-size:.8rem;padding:8px 9px;background:#fff7e4;color:#785500;margin-top:8px;border-radius:5px}
.edit-compare{font-size:.8rem}.alert{font-size:.8rem;line-height:1.6;padding:7px 9px}
.rfoot{position:static;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0;padding:11px 14px;border-top:1px solid var(--line);background:#f4f7fa}
.rfoot .tbtn{padding:8px 6px;font-size:.84rem;white-space:normal}
.clipboard-info{font-size:.76rem;margin:16px 0 6px}.clipboard-info summary{font-weight:400;color:var(--dim)}
.clipboard-info p{line-height:1.75}.ver{font-size:.68rem;margin-top:9px}

.app-notice.error{background:#922b25}
dialog{border-radius:12px;max-height:92vh} .dlg{max-height:74vh}.dlgfoot{padding-top:8px}
@media(min-width:1024px) and (max-width:1200px){.layout{grid-template-columns:126px minmax(0,1fr) 334px}main.form{padding-left:18px;padding-right:18px}.formbar{flex-wrap:wrap}.current-section{flex-basis:100%}.toc li a{font-size:.83rem;padding-left:7px}.formbar .result-link{margin-left:auto}}

  .tocsel{padding:9px 14px;background:#f8fafc} main.form{padding:0 16px 58vh;overflow:visible}

  aside.result{height:48vh;max-height:48vh;box-shadow:0 -3px 18px #193f5912;border-radius:12px 12px 0 0}
  .rhead{padding:7px 14px}.rhead-status{min-height:32px}.rhead .foldbtn{margin:0}
  .rhead-actions{margin-top:4px}.rhead-actions .tbtn{font-size:.76rem;min-height:30px}
  .review-progress{margin-top:3px}.rfoot{grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 12px}.rfoot .tbtn{font-size:.76rem}
  aside.result.folded{height:53px;max-height:53px}.result.folded .result-scroll,.result.folded .rfoot,.result.folded .rhead-actions,.result.folded .review-progress{display:none}
  body.result-folded main.form{padding-bottom:90px}.app-notice{bottom:60px}
}
@media(max-width:520px){.top h1{font-size:1.05rem}.formbar .current-section{flex-basis:100%}.formbar .result-link{margin-left:auto}.sec>h2{font-size:1.04rem}.opt{font-size:.91rem;padding:8px 10px}.rfoot{grid-template-columns:1fr 1fr}.rhead-actions .tbtn{font-size:.7rem}.section-actions .result-link{margin-left:0}.rhead-status .rcount{font-size:.87rem}}

</style>

<style>
.sessionbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:6px 18px;border-bottom:1px solid var(--line);font-size:.78rem;background:#f5f8fb;flex:0 0 auto}
.sessionbar .recovery-setting{margin-left:auto;display:flex;gap:6px;align-items:center}.sessionbar .tbtn{font-size:.75rem;min-height:29px}
.focus-target{outline:3px solid #d28b15!important;outline-offset:4px;border-radius:4px}
.missing-jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.diff-mark{background:#fff0af;color:inherit}.transfer-ack{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-weight:600}.transfer-ack input{margin-top:7px}
.history-info{color:var(--dim)}
.app-help-intro{padding:18px 20px;border:1px solid #d6e5e4;background:#f1f8f7;border-radius:10px;margin:12px 0 18px}

.app-help-intro p{margin:0;line-height:1.8}.app-help-steps{padding-left:24px;line-height:1.9}
.app-help-steps li{padding-left:4px;margin:9px 0}.app-help-note{color:var(--dim);font-size:.88rem;line-height:1.8}
.app-help-keys{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;font-size:.88rem}
.app-help-keys dt{font-weight:600}.app-help-keys dd{margin:0}

<body>

<div class="top">
  <h1>MSE 작성 보조 도구</h1>
  <span class="spacer"></span>
  <span class="fontctl">
    <button type="button" id="fontDown" title="글자 작게">가−</button>
    <button type="button" id="fontUp" title="글자 크게">가＋</button>
  </span>

<script>
(function(){

/* 화면 대신 안내문을 띄운다 — content.js 를 고치다 깨졌을 때 쓰임 */
function fatal(title, detail){
  var box = document.getElementById("formArea");
  box.innerHTML = "";
  var h = document.createElement("h2");
  h.textContent = title;
  h.style.color = "#B3261E";
  box.appendChild(h);

if (typeof CONTENT === "undefined") {
  fatal("기록 화면을 불러오지 못했습니다.", [
    "프로그램을 닫은 뒤 정상 배포본의 EXE 파일로 교체하고 다시 실행하세요.",
    "화면과 문구는 EXE에 포함되어 있습니다. 내부 파일은 프로그램이 자동으로 관리합니다.",
    "다시 실행해도 문제가 계속되면 이 화면과 프로그램 버전을 담당자에게 알려 주세요."
  ]);

}

/* 파일은 읽혔지만 구조가 깨진 경우 (섹션을 통째로 지웠다든지) */
if (!CONTENT.sections || !CONTENT.sections.length || !CONTENT.ui || !CONTENT.format) {
  fatal("기록 문구를 확인할 수 없습니다.", [
    "프로그램을 닫은 뒤 정상 배포본의 EXE 파일로 교체하고 다시 실행하세요.",
    "같은 문제가 계속되면 이 화면과 프로그램 버전을 담당자에게 알려 주세요."

/* ============================================================
   ==== LOGIC-START ====

   ============================================================ */

var UI = CONTENT.ui || {};      /* 화면 라벨 문구 (content.js) */
var FMT = CONTENT.format || {}; /* 전체 복사 줄 모양 (content.js) */

var BUILD_CACHE = {};
var FORM_SIGNATURES = {};
var RECORD_EPOCH = 0;
var V = {};      /* 입력값.  키: "섹션id/그룹id" 또는 "섹션id/프레임id@옵션id/그룹id" */
var INST = {};   /* 반복 프레임 인스턴스 목록. 키: "섹션id/프레임id" -> ["0","1"] */
var EDIT = {};   /* 직접 수정된 결과 문장. 키: "섹션id:슬롯id" */
var EDIT_BASE = {};
var CONF_SNAPSHOT = {};
var CONF = {};   /* [이 항목 확인] 클릭 여부 */
var TOUCH = {};  /* 섹션 입력을 하나라도 바꿨는지 */

var SEC = {};
CONTENT.sections.forEach(function(s){
  SEC[s.id] = s;
  if(s.groups.some(function(g){return g.id==='opinion';})){
    var at=s.groups.findIndex(function(g){return g.id==='opinion';});
    s.groups.splice(at,0,{id:'opinion_source',type:'select',label:'기타 의견 · 정보 출처',options:[{id:'self',ko:'본인 진술'},{id:'observer',ko:'직접 관찰'},{id:'family',ko:'보호자 전달'}]},
      {id:'opinion_time',type:'select',label:'기타 의견 · 해당 시점',options:[{id:'current',ko:'이번 면담'},{id:'recent',ko:'최근'},{id:'past',ko:'과거'}]});
  }
});

/* ---------- 한글 조사 ---------- */
var DIGIT_BATCHIM = {"0":true,"1":true,"3":true,"6":true,"7":true,"8":true,"2":false,"4":false,"5":false,"9":false};
function lastCharBatchim(word){
  if (!word) return null;
  var s = String(word).replace(/[)\]}'"”’\s.·]+$/,"");
  if (!s) return null;
  var ch = s.charAt(s.length-1);
  if (DIGIT_BATCHIM.hasOwnProperty(ch)) return {b:DIGIT_BATCHIM[ch], rieul:(ch==="1"||ch==="7"||ch==="8")};
  var c = ch.charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return null;
  var j = (c - 0xAC00) % 28;
  return {b:j !== 0, rieul:j === 8};
}
function josa(word, pair){
  var info = lastCharBatchim(word);
  var b = info ? info.b : false;
  var rieul = info ? info.rieul : false;
  switch(pair){
    case "을를": return b ? "을" : "를";
    case "이가": return b ? "이" : "가";
    case "은는": return b ? "은" : "는";
    case "와과": return b ? "과" : "와";
    case "라고": return b ? "이라고" : "라고";
    case "라는": return b ? "이라는" : "라는";
    case "로으로": return (!b || rieul) ? "로" : "으로";
    case "이": return b ? "이" : "";
    default: return "";
  }
}
/* 문자열 안의 {을를} 등을 앞 글자에 맞춰 바꾼다.
   앞이 따옴표·괄호로 끝나면 그 앞 글자까지 보고 고른다 (예: '…값'{라고} → '…값'이라고) */
function fixJosa(s){
  return String(s).replace(/([\s\S]{0,12})\{(을를|이가|은는|와과|라고|라는|로으로|이)\}/g, function(m, prev, pair){
    return prev + josa(prev, pair);
  });
}
/* 템플릿 치환: fill("{a}와 {b}", {a:"1",b:"2"}) */
function fill(tpl, map){
  var s = String(tpl == null ? "" : tpl);
  Object.keys(map || {}).forEach(function(k){
    /* 사용자가 적은 글 안의 { } 는 조사 표식으로 오해하지 않도록 잠시 가려 둔다 */
    var v = map[k] == null ? "" : String(map[k]).split("{").join("").split("}").join("");
    s = s.split("{" + k + "}").join(v);
  });
  return fixJosa(s).split("").join("{").split("").join("}");
}
/* 나열: "가", "가와 나", "가, 나와 다" */
function joinKo(list){
  var a = (list || []).filter(function(x){ return x !== null && x !== undefined && String(x) !== ""; });
  if (!a.length) return "";
  if (a.length === 1) return String(a[0]);
  var head = a.slice(0, a.length-1), tail = String(a[a.length-1]);
  return head.join(", ") + josa(head[head.length-1], "와과") + " " + tail;
}
/* 조각 잇기: 마지막만 end, 나머지는 mid */
function joinFrags(opts){
  var a = (opts || []).filter(function(o){ return o && (o.mid || o.end); });
  if (!a.length) return "";
  var out = [];
  for (var i=0;i<a.length;i++){
    var last = (i === a.length-1);
    var f = last ? (a[i].end || a[i].mid) : (a[i].mid || a[i].end);
    if (f) out.push(f);
  }
  return out.join(" ");
}
/* 조각 여러 개를 문장 여러 개로 나눈다.
   규칙 (계획서 7장 "한 문장에 한 가지"):
     · 정상 소견과 이상 소견을 한 문장에 섞지 않는다
     · 한 문장에 최대 두 가지까지만 담는다
   items = [{mid, end, abn, lead}]  lead 는 그 조각이 문장 첫머리일 때 앞에 붙는 말 */
function buildLines(items){
  var a = (items || []).filter(function(x){ return x && (x.mid || x.end); });
  var out = [], i = 0;
  while (i < a.length){
    var chunk = [a[i]];
    if (i + 1 < a.length && a[i+1].abn === a[i].abn) chunk.push(a[i+1]);
    var lead = chunk[0].lead ? chunk[0].lead + " " : "";
    out.push({ text: lead + joinFrags(chunk), abn: !!chunk[0].abn });
    i += chunk.length;
  }
  return out;
}
/* 사용자가 적은 글을 문장 가운데 끼울 때 끝의 마침표를 뗀다 */
function midText(t){ return String(t == null ? "" : t).trim().replace(/[.\s]+$/, ""); }
/* 대상자 표현을 따옴표째 적었을 때 바깥 따옴표 한 겹을 뗀다 — 문구가 다시 따옴표를 씌우기 때문 */
function unquote(t){
  var s = String(t == null ? "" : t).trim();
  var pairs = [["'", "'"], ['"', '"'], ["\u2018", "\u2019"], ["\u201C", "\u201D"], ["\u300C", "\u300D"]];
  for (var i = 0; i < pairs.length; i++){
    if (s.length >= 2 && s.charAt(0) === pairs[i][0] && s.charAt(s.length-1) === pairs[i][1]){
      return s.slice(1, -1).trim();
    }
  }
  return s;
}

/* 문장 마무리: 공백 정리 + 마침표 하나 */
function sentence(s){
  var t = String(s == null ? "" : s).replace(/\s+/g," ").trim();
  if (!t) return "";
  t = t.replace(/[,;，；]+$/, "").trim();
  if (/[!?？！…]$/.test(t) || /[!?？！]["'”’]$/.test(t)) return t;
  t = t.replace(/[.]+$/, "");
  return t ? t + "." : "";
}
/* 문단 조립 */
function para(parts){
  return (parts || []).map(sentence).filter(Boolean).join(" ");
}
/* 외관은 조립된 문장 단위로 줄을 나눈다. 숫자 소수점·인용문·직접 편집은 건드리지 않는다. */
function appearanceLines(parts){
  return (parts||[]).map(function(part){
    return String(part==null?'':part).split(/\r?\n/).map(function(line){
      var text=sentence(line),out='',closing='',pairs={'"':'"',"'":"'",'“':'”','‘':'’','「':'」','(' : ')'};
      for(var i=0;i<text.length;i++){
        var ch=text[i];out+=ch;
        if(closing){if(ch===closing)closing='';continue;}
        if(pairs[ch]){closing=pairs[ch];continue;}
        if(/[.!?]/.test(ch)&&/[가-힣]/.test(text[i-1]||'')){
          var j=i+1;while(/\s/.test(text[j]||'')&&j<text.length)j++;
          if(/[가-힣A-Za-z0-9]/.test(text[j]||'')){out+='\n';i=j-1;}
        }
      }return out;
    }).filter(Boolean).join('\n');
  }).filter(Boolean).join('\n');
}
function opinionText(text, source, when){
  var labels={self:'본인 진술',observer:'직접 관찰',family:'보호자 전달'}, times={current:'이번 면담',recent:'최근',past:'과거'};
  var lead=[times[when],labels[source]].filter(Boolean).join(' · ');
  return (lead ? lead+': ' : '')+String(text).split(/\r?\n/).map(sentence).filter(Boolean).join('\n');
}

/* ---------- 값 접근 ---------- */
function groupsOf(sid, framePath){
  var sec = SEC[sid];
  if (!framePath) return sec.groups || [];
  return (sec.frames && sec.frames[framePath] && sec.frames[framePath].groups) || [];
}
function ctxFor(prefix, groups){
  var byId = {};
  (groups || []).forEach(function(g){ byId[g.id] = g; });
  function optOf(gid, id){
    var g = byId[gid];
    if (!g || !g.options) return null;
    for (var i=0;i<g.options.length;i++) if (g.options[i].id === id) return g.options[i];
    return null;
  }
  return {
    prefix: prefix,
    groups: groups || [],
    group: function(gid){ return byId[gid]; },
    raw: function(gid){ return V[prefix + "/" + gid]; },
    /* 단일 선택 옵션 객체 */
    opt: function(gid){ return optOf(gid, V[prefix + "/" + gid]); },
    /* 복수 선택 옵션 객체들 — 고른 순서 그대로 */
    opts: function(gid){
      var v = V[prefix + "/" + gid] || [];
      var out = [];
      for (var i=0;i<v.length;i++){ var o = optOf(gid, v[i]); if (o) out.push(o); }
      return out;
    },
    /* 복수 선택 — 표에 적힌 순서(문장 조립용) */
    optsOrdered: function(gid){
      var g = byId[gid]; if (!g || !g.options) return [];
      var v = V[prefix + "/" + gid] || [];
      return g.options.filter(function(o){ return v.indexOf(o.id) >= 0; });
    },
    txt: function(gid){ return String(V[prefix + "/" + gid] == null ? "" : V[prefix + "/" + gid]).trim(); },
    num: function(gid){ var x = V[prefix + "/" + gid]; return (x === 0 || x) ? x : null; }
  };
}
function frameCtx(sid, fid, key){
  var sec = SEC[sid];
  var f = sec.frames[fid];
  var prefix = sid + "/" + fid + (key ? key : "");
  return ctxFor(prefix, f.groups);
}
function abnormal(opt){ return !!opt && !opt.normal; }
function pickAbnormal(list){ return (list || []).filter(function(o){ return !o.normal; }); }

/* ============================================================
   섹션별 조립기
   ============================================================ */
var BUILD = {};

/* ---------- 1) 외관 ---------- */
BUILD.appearance = function(c, sec){
  var O = sec.outputs, parts = [], abn = [], appearanceAlerts = [];
  function put(list, isAbn){
    (list || []).forEach(function(x){ if (!x) return; parts.push(x); if (isAbn) abn.push(x); });
  }
  function putLines(lines){
    (lines || []).forEach(function(L){ parts.push(L.text); if (L.abn) abn.push(L.text); });
  }
  function lineTexts(lines){ return (lines || []).map(function(L){ return L.text; }); }
  /* 조각 하나 만들기 — 세부 텍스트가 비면 *_notext 문구로 대신함 */
  function frag(o, textKey, lead){
    if (!o) return null;
    var t = textKey ? midText(c.txt(textKey)) : "";
    var useNo = (textKey && !t);
    return {
      mid: fill(useNo ? (o.mid_notext || o.end_notext || o.mid) : (o.mid || o.end), {text:t}),
      end: fill(useNo ? (o.end_notext || o.mid_notext || o.end) : (o.end || o.mid), {text:t}),
      abn: !o.normal,
      /* '확인 못 함'은 이상 소견이 아니지만 '간단히'에서도 빼지 않는다 — 못 본 것을 본 것처럼 남기지 않기 위해 */
      keep: !!o.notobserved,
      lead: lead || ""
    };
  }
  /* 복수 선택 그룹의 낱말을 이어 붙임 (세부 텍스트가 비면 noun_notext) */
  function nouns(opts, textKey){
    var t = textKey ? midText(c.txt(textKey)) : "";
    return (opts || []).map(function(o){
      var n = (textKey && !t && o.noun_notext) ? o.noun_notext : (o.noun || "");
      return fill(n, {text:t});
    }).filter(Boolean);
  }

  /* [v2.0] 면담 형태 — 전화·사이버 상담은 외관을 볼 수 없으므로 관찰 문장을 만들지 않는다 */
  var cmode = c.opt("contact_mode"), cmId = cmode ? cmode.id : "visit_center";
  var ab = c.opt("age_band"), gd = c.opt("gender");
  if (cmId === "phone" || cmId === "online"){
    var s1p = fill(O.s1_phone, {age: ab ? ab.noun : UI.missing, gender: gd ? gd.noun : UI.missing});
    var notObs = (cmId === "phone") ? O.not_observed_phone : O.not_observed_online;
    return { check: "", slots: [{id:"main", label:"", text: appearanceLines([s1p, notObs])}], summary: sentence(notObs), alerts: [] };
  }

  /* [v2.1] 외관 문단 길이 — '간단히'는 정상일 때의 문장(동행·표정·시선·자세·안색)을 뺀다.
     이상 소견은 그대로 나가고, abn 목록이 같으므로 요약문은 바뀌지 않는다 */
  var lvl = c.opt("detail_level");
  var brief = !!(lvl && lvl.id === "brief");
  /* [v2.1.1] 첫머리(lead)는 그 그룹의 모든 조각이 들고 있으므로 여기서 억지로 달지 않는다.
     (억지로 달면 살아남은 첫 조각이 다른 그룹일 때 "안색은 영양 상태가…" 같은 문장이 된다) */
  function briefOnly(items){
    if (!brief) return items;
    return (items || []).filter(function(f){ return f && (f.abn || f.keep); });
  }

  /* ① 첫 문장 — 겉보기 연령 · 체격 · 키 · 연령대 · 성별 */
  var ap = c.opt("apparent_age"), bd = c.opt("build"), ht = c.opt("height");
  var m = {
    apparent: ap ? (ap.mid || "") : "",
    build: bd ? (bd.noun || "") : "",
    height: (ht && !ht.normal) ? (ht.noun || "") : "",
    age: ab ? ab.noun : UI.missing,
    gender: gd ? gd.noun : UI.missing
  };
  parts.push(fill(m.height ? O.s1_height : O.s1_no_height, m));

  /* ①-6 동행 — 정상·이상을 가르는 소견이 아니라 사실이므로 요약문 판정에서는 뺀다 */
  var accAll = c.optsOrdered("accompanied");
  var accAbn = pickAbnormal(accAll);
  /* joinKo 는 마지막 앞에 와/과 를 넣으므로 여기서는 쉼표로만 잇는다 ("가족, 기관 담당자와 함께") */
  if (cmId === "home"){
    /* [v2.0] 가정방문 — '내소함'이 아니라 방문 상황에 맞는 문장 */
    parts.push(accAbn.length ? fill(O.visit_with, {list:joinKo(nouns(accAbn, "accompanied_text"))}) : O.visit_alone);
  }
  else if (accAbn.length) parts.push(fill(O.accompanied, {list:nouns(accAbn, "accompanied_text").join(", ")}));
  else if (!brief && accAll.length && accAll[0].end) parts.push(accAll[0].end);

  /* ② 위생 — 머리 / 수염·손톱 / 전반 청결 · 체취 */
  var hairAll = c.optsOrdered("hair");
  var hairSeq = hairAll.filter(function(o){ return !o.standalone; });
  var hairOdd = hairAll.filter(function(o){ return o.standalone; });
  var hy = c.opt("hygiene");
  var odAbn = pickAbnormal(c.optsOrdered("odor"));
  var hygItems = [];
  /* 첫머리는 머리 조각에만 달아 둔다 — 뒤따르는 청결·체취 문장으로 번지면 안 된다 */
  hairSeq.forEach(function(o){
    var f = frag(o);
    if (f){ f.lead = O.hair_lead || ""; hygItems.push(f); }
  });
  var beard = c.optsOrdered("beard_nail");
  var beardConflict = beard.some(function(o){return o.id === "beard_kept";}) && beard.some(function(o){return o.id === "beard";});
  if (beardConflict) appearanceAlerts.push("불러온 수염 선택에 ‘정돈됨’과 ‘정돈되지 않음’이 함께 있습니다. 수염·손톱에서 실제 관찰에 맞는 항목을 다시 선택하세요.");
  pickAbnormal(beard).forEach(function(o){
    if (!beardConflict || (o.id !== "beard_kept" && o.id !== "beard")) hygItems.push(frag(o));
  });
  if (hy) hygItems.push(frag(hy));
  if (odAbn.length){
    var odS = fill(O.odor, {list:joinKo(nouns(odAbn))});
    hygItems.push({ mid: odS, end: odS, abn: true });
  }
  hairOdd.forEach(function(o){
    var t = midText(c.txt("hair_odd_text")) || o.end_notext || o.ko;
    parts.push(t); abn.push(t);
  });
  putLines(buildLines(hygItems));

  /* ②-5 구강·치아 · ②-6 화장·몸단장 — 이상일 때만 */
  putLines(buildLines(pickAbnormal(c.optsOrdered("oral")).map(function(o){ return frag(o); })));
  putLines(buildLines(pickAbnormal(c.optsOrdered("grooming")).map(function(o){ return frag(o); })));

  /* ③ 복장 — 계절·상황을 함께 고를 수 있음 */
  var dfAll = c.optsOrdered("dress_fit"), dfAbn = pickAbnormal(dfAll);
  var dnAll = c.optsOrdered("dress_neat"), dnAbn = pickAbnormal(dnAll);
  if (!dfAbn.length && !dnAbn.length && dfAll.length && dnAll.length) parts.push(O.dress_normal);
  else {
    var dressItems = [];
    if (dfAbn.length){
      var dtx = midText(c.txt("dress_fit_text"));
      var dmap = {text:dtx, list:joinKo(nouns(dfAbn))};
      dressItems.push({
        mid: fill(dtx ? O.dress_bad_mid : O.dress_bad_notext_mid, dmap),
        end: fill(dtx ? O.dress_bad : O.dress_bad_notext, dmap),
        abn: true
      });
    } else if (dfAll.length) dressItems.push(frag(dfAll[0]));
    dnAll.forEach(function(o){ dressItems.push(frag(o)); });
    putLines(buildLines(dressItems));
  }
  var dodd = c.opt("dress_odd");
  if (abnormal(dodd)) put([midText(c.txt("dress_odd_text")) || O.dress_odd_notext], true);

  /* ④ 표정 */
  /* 첫머리는 표정 조각마다 달아 둔다 — 문장이 둘로 나뉘면 뒤 문장도 "표정은"으로 시작한다 */
  var exprItems = [];
  c.optsOrdered("expression").forEach(function(o){
    var f = frag(o);
    if (f){ f.lead = O.expr_lead || ""; exprItems.push(f); }
  });
  putLines(buildLines(briefOnly(exprItems)));

  /* ⑤ 시선 접촉 — 주어가 '표정'이 아니므로 언제나 별도 문장 */
  putLines(buildLines(briefOnly(c.optsOrdered("eye_contact").map(function(o){ return frag(o); }))));

  /* ⑥ 자세 · 걸음걸이 */
  var moveItems = [];
  c.optsOrdered("posture").forEach(function(o){ moveItems.push(frag(o)); });
  c.optsOrdered("gait").forEach(function(o){ var f = frag(o); if (f && (f.mid || f.end)) moveItems.push(f); });
  putLines(buildLines(briefOnly(moveItems)));

  /* ⑦-1·2 안색 · 영양 상태 */
  var cxAll = c.optsOrdered("complexion").filter(function(o){ return o.mid || o.end; });
  var nu = c.opt("nutrition");
  var cxIsPlainNormal = !cxAll.length && c.optsOrdered("complexion").some(function(o){ return o.id === "normal"; });
  if (cxIsPlainNormal && nu && nu.normal){ if (!brief) parts.push(O.body_normal); }
  else {
    /* 첫머리는 안색 조각에만 — 뒤에 오는 영양 조각으로 번지면 "안색은 영양 상태가…"가 된다 */
    var bodyItems = cxAll.map(function(o){
      var f = frag(o); if (f) f.lead = O.complexion_lead || ""; return f;
    });
    if (nu) bodyItems.push(frag(nu));
    putLines(buildLines(briefOnly(bodyItems)));
  }

  /* ⑦-3 피부 — 이상일 때만 */
  var skinItems = pickAbnormal(c.optsOrdered("skin")).map(function(o){
    var f = frag(o); if (f) f.lead = O.skin_lead || ""; return f;
  });
  putLines(buildLines(skinItems));

  /* ⑦-4~9 그 밖의 특이 소견 */
  var bits = [];
  var we = pickAbnormal(c.optsOrdered("wearing"));
  if (we.length) bits.push(fill(O.wearing, {list:joinKo(nouns(we, "wearing_text"))}));
  var inj = c.opt("injury"), injT = midText(c.txt("injury_text"));
  if (abnormal(inj)) bits.push(injT ? fill(O.injury, {text:injT}) : O.injury_notext);
  var tat = c.opt("tattoo");
  var tatPart = midText(c.txt("tattoo_text")), tatShape = midText(c.txt("tattoo_shape"));
  if (abnormal(tat)){
    if (tatPart && tatShape) bits.push(fill(O.tattoo_both, {part:tatPart, shape:tatShape}));
    else if (tatPart) bits.push(fill(O.tattoo, {text:tatPart}));
    else if (tatShape) bits.push(fill(O.tattoo_shape_only, {shape:tatShape}));
    else bits.push(O.tattoo_notext);
  }
  var se = pickAbnormal(c.optsOrdered("side_effect"));
  if (se.length) bits.push(fill(O.side_effect, {list:joinKo(nouns(se))}));
  lineTexts(buildLines(pickAbnormal(c.optsOrdered("belongings")).map(function(o){
    if (cmId === "home" && o.id === "pet") return {mid:"면담 장소에 반려동물이 함께 있고",end:"면담 장소에 반려동물이 함께 있음",abn:true};
    return frag(o);
  })))
    .forEach(function(x){ bits.push(x); });
  var expressionHasFatigue = c.optsOrdered("expression").some(function(o){ return o.id === "tired"; });
  pickAbnormal(c.optsOrdered("health")).forEach(function(o){
    if (o.id !== "tired" || !expressionHasFatigue) bits.push(o.end);
  });
  /* 기본값만으로 관찰 범위 전체의 부정 소견을 만들지 않는다. */
  put(bits, true);

  /* ⑧ 자유 기술 */
  var ft = c.txt("free_text");
  if (ft) { parts.push(ft); abn.push(ft); }

  /* 요약문(6.3) — 첫 문장 + 이상이 있는 조각만 */
  var sumHead = fill(m.height ? O.sum_prefix_height : O.sum_prefix_no_height, m);
  var normalTail = [];
  if (hy && hy.normal) normalTail.push(O.sum_hygiene_normal);
  if (dfAll.length && dnAll.length && !dfAbn.length && !dnAbn.length) normalTail.push(O.sum_dress_normal);
  var summary = abn.length
    ? para([sumHead + " " + abn.map(function(x){ return String(x).replace(/[.]+$/,""); }).join(". ")])
    : normalTail.length ? sentence(sumHead + " " + normalTail.join(". "))
    : sentence(fill(m.height ? O.s1_height : O.s1_no_height, m));

  return {
    check: "",
    slots: [{id:"main", label:"", text:appearanceLines(parts)}],
    summary: summary,
    alerts: appearanceAlerts,
    blockingMessage: appearanceAlerts[0] || ""
  };
};

/* ---------- 2) 태도 ---------- */
BUILD.attitude = function(c, sec){
  var O = sec.outputs;
  var sel = c.opts("attitude");
  var others = pickAbnormal(sel);
  var summary;
  if (!others.length) summary = sentence(sec.summary.normal);
  else {
    var coop = sel.filter(function(o){ return o.normal; });
    summary = sentence(O.lead + " " + joinFrags(coop.concat(c.optsOrdered("attitude").filter(function(o){ return !o.normal; }))));
  }
  var t = c.txt("attitude_text");
  if (t) summary = summary + " " + sentence(t);
  return {
    check: FMT.checkMark + (sel.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing),
    slots: [],
    summary: summary,
    alerts: []
  };
};

/* ---------- 3) 행동 ---------- */
BUILD.behavior = function(c, sec){
  var O = sec.outputs;
  var sel = c.opts("behavior");
  var abn = pickAbnormal(c.optsOrdered("behavior"));
  var summary;
  /* [v2.0.2] 전화·사이버 상담에서는 행동을 볼 수 없다.
     직접 고른 이상 소견이 없으면 "특이사항없음"으로 단정하지 않는다(고른 것이 있으면 그대로 둔다). */
  var cmB = V["appearance/contact_mode"];
  var noObs = (!abn.length) && (cmB === "phone" || cmB === "online") && sec.not_observed;
  if (noObs){
    var txtB = (cmB === "phone") ? sec.not_observed.phone : sec.not_observed.online;
    return { check: txtB, slots: [], summary: sentence(txtB), alerts: [] };
  }
  if (!abn.length) summary = sentence(sec.summary.normal);
  else {
    var t = c.txt("behavior_text");
    /* 영문 병기 괄호가 붙은 낱말끼리는 쉼표 대신 가운뎃점으로 잇는다(구분 기호는 content.js) */
    var list = t ? t : abn.map(function(o){ return fill(O.item, {ko:o.ko, en:o.en}); }).join(O.item_sep || ", ");
    summary = sentence(fill(O.observed, {list:list}));
  }
  return {
    check: FMT.checkMark + (sel.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing),
    slots: [],
    summary: summary,
    alerts: []
  };
};

/* ---------- 4) 언어 ---------- */
BUILD.speech = function(c, sec){
  var O = sec.outputs;
  var ids = ["spontaneity","productivity","rate","pitch","tone"];
  var picked = ids.map(function(g){ return c.opt(g); });
  var dis = c.opts("disorder");
  var disAbn = pickAbnormal(c.optsOrdered("disorder"));
  var chk = [];
  picked.forEach(function(o,i){ chk.push("(" + (i+1) + ") " + (o ? (o.en || o.ko) : UI.missing)); });
  chk.push("(6) " + (dis.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing));

  var abn = picked.filter(function(o){ return o && !o.normal; });
  var summary;
  if (!abn.length && !disAbn.length) summary = sentence(sec.summary.normal);
  else {
    var head = abn.length ? sentence(joinFrags(abn)) : "";
    var dcl = disAbn.length
      ? sentence(fill(O.disorder_some, {list:joinKo(disAbn.map(function(o){ return o.ko || o.en; }))}))
      : sentence(O.disorder_none);
    summary = (head ? head + " " : "") + dcl;
  }
  return { check: chk.join(" "), slots: [], summary: summary, alerts: [] };
};

/* ---------- 5) 기분 ---------- */
BUILD.mood = function(c, sec){
  var O = sec.outputs;
  var mood = c.opts("mood");
  var moodAbn = pickAbnormal(c.opts("mood"));   /* 체크 안내와 같이 '고른 순서' 를 따른다 */
  var fit = c.opt("affect_fit");
  var types = pickAbnormal(c.optsOrdered("affect_type"));
  var chk = "(1) " + (mood.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing)
          + " (2) " + (fit ? (fit.en || fit.ko) : UI.missing)
          + (types.length ? " / " + types.map(function(o){ return o.en || o.ko; }).join(", ") : "");

  var allNormal = !moodAbn.length && fit && fit.normal && !types.length;
  var summary;
  if (allNormal) summary = sentence(sec.summary.normal);
  else {
    var moodSent;
    if (moodAbn.length){
      var q = c.txt("mood_text");
      var lead = q ? fill(O.mood_quote, {text:q}) : O.mood_lead;
      var score = c.num("mood_score");
      moodSent = lead + " " + joinFrags(moodAbn) + ((score === 0 || score) ? fill(O.score, {n:score}) : "");
    } else {
      var eu = c.opts("mood")[0];
      moodSent = O.mood_lead + " " + (eu ? eu.end : "");
    }
    var affSent;
    if (types.length) affSent = (fit ? fit.mid : "") + " " + joinFrags(types);
    else affSent = (fit ? fit.end : "");
    var ftx = c.txt("affect_fit_text");
    summary = sentence(moodSent) + " " + sentence(affSent) + (ftx ? " " + sentence(ftx) : "");
  }
  return { check: chk, slots: [], summary: summary, alerts: [] };
};

/* ---------- 6) 지각 ---------- */
/* [v1.7] 이 화면 파일 자신의 판. content.js 의 version 과 다르면 한쪽만 덮어쓴 것이다. */
var APP_VERSION = "3.3";

BUILD.perception = function(c, sec){
  var O = sec.outputs;
  var all = c.group("hallucination").options;
  var sel = c.opts("hallucination");
  var halls = pickAbnormal(c.optsOrdered("hallucination"));
  var parts = [];
  var pAlerts = [];   /* [v1.6] 명령 환청 등 위험 신호를 결과 카드에 띄우기 위한 것 */

  var firstTwo = [];
  if (!halls.length){
    /* [v2.0.2] 전화·사이버 상담에서는 '반응하는 행동 관찰되지 않음' 을 주장하지 않는다 */
    var cmP = V["appearance/contact_mode"];
    parts.push(((cmP === "phone" || cmP === "online") && O.none_notobs) ? O.none_notobs : O.none);
  } else {
    halls.forEach(function(h){
      var f = frameCtx("perception", "hallu", "@" + h.id);
      var sub = [];
      sub.push(fill(O.lead, {type:h.ko}));
      /* [v2.1] 대상자 표현 끝의 마침표는 떼고 인용한다 ('…난다.' 처럼 따옴표 안에 남으면 안 된다) */
      var content = midText(unquote(f.txt("content")));
      var fq = f.opt("freq");
      var ctxs = f.optsOrdered("context").map(function(o){ return o.noun; }).filter(Boolean);
      /* [v2.1] 발생 상황은 계획서 예문대로 둘까지는 공백으로 잇고, 셋 이상이면 쉼표로 끊는다 */
      var ctxText = ctxs.length > 2 ? ctxs.join(", ") : ctxs.join(" ");
      if (content){
        /* [v2.0.2] 내용을 문장으로 적으면("누가 자기 욕을 한다") {이가} 가 동사 뒤에 붙어 비문이 된다.
           사고 섹션과 같이 '~다'로 끝나면 인용 형태의 틀을 쓴다. */
        var cda = /다$/.test(content.replace(/[)\]}'"”’\s.]+$/, ""));
        var dtpl = ctxs.length
          ? (cda && O.detail_da ? O.detail_da : O.detail)
          : (cda && O.detail_nocontext_da ? O.detail_nocontext_da : O.detail_nocontext);
        sub.push(fill(dtpl, {
          content: content, freq: fq ? fq.noun : "", context: ctxText,
          verb: h.verb || "", percept: h.percept || ""
        }));
      }
      var onset = f.txt("onset");
      var rc = f.opt("reaction");
      var rcs = rc ? fill(rc.end, {percept: h.percept || ""}) : "";
      /* [v1.6] 대상자 반응을 고르지 않았으면 단정하지 않는다. 시작 시기만 적었으면 그것만 남긴다 */
      if (rcs) sub.push(onset ? fill(O.onset, {onset:onset, reaction:rcs}) : fill(O.onset_only, {reaction:rcs}));
      else if (onset) sub.push(fill(O.onset_alone, {onset:onset}));
      var imp = pickAbnormal(f.optsOrdered("impact"));
      if (imp.length){
        var impTx = midText(f.txt("impact_text"));
        var impFrag = joinFrags(imp.map(function(o){
          /* [v2.1] '기타'를 고르고 칸을 비우면 조각이 빈 글이 되어 문장이 통째로 사라진다 — [미입력] 로 남긴다 */
          if (o.id === "other" && !impTx){
            var miss = fill(O.impact_other_missing, {missing: UI.missing});
            return {mid: miss, end: miss};
          }
          return {mid: fill(o.mid || "", {text:impTx}), end: fill(o.end || "", {text:impTx})};
        }));
        if (impFrag) sub.push(impFrag);
      }
      var cmdRisk = "";
      if (f.group("command") && (h.id === "auditory")){
        var cm = f.opt("command");
        if (cm && !cm.normal){
          /* [v2.1] 내용 칸이 비면 빈 따옴표('')가 나가므로, 확인 못 한 것으로 적는다 */
          var cmdTx = midText(unquote(f.txt("command_text")));
          cmdRisk = cmdTx ? fill(O.command_yes, {text:cmdTx})
                          : fill(O.command_yes_notext, {missing: UI.missing});
          sub.push(cmdRisk);
          pAlerts.push(O.alert_command);            /* [v1.6] 자·타해 지시 환청은 위험 신호 */
        }
        else if (cm) sub.push(O.command_no);
        else sub.push(fill(O.command_unknown, {missing: UI.missing}));   /* [v1.6] 묻지 않은 것을 '부인함'으로 적지 않는다 */
      }
      /* [v1.6] 명령 환청은 요약문에서 빠지면 안 된다
         [v2.1] 다만 앞 두 조각에 이미 들어 있으면 다시 붙이지 않는다 (요약문에 같은 문장이 두 번 나갔다) */
      var brief = sub.slice(0, 2);
      if (cmdRisk && brief.indexOf(cmdRisk) < 0) brief.push(cmdRisk);
      if (h.id === "auditory" && !f.opt("command")) {
        var unknownCommand = fill(O.command_unknown, {missing:UI.missing});
        if (brief.indexOf(unknownCommand) < 0) brief.push(unknownCommand);
      }
      firstTwo = firstTwo.concat(brief);
      parts.push(para(sub));
    });
    var rest = all.filter(function(o){ return !o.normal && halls.indexOf(o) < 0; }).map(function(o){ return o.short || o.ko; });
    /* Unselected hallucination types are not evidence of a patient denial. */
  }

  var op = c.opt("other_perception");
  if (abnormal(op)) {
    var otx = c.txt("other_perception_text");
    parts.push(otx ? fill(O.other_perception, {label:op.noun || op.ko, text:otx})
                   : fill(O.other_perception_notext, {label:op.noun || op.ko}));
  }

  var text = para(parts);
  /* 요약문은 첫 유형의 앞 두 조각만 (문자열을 자르지 않고 조각을 그대로 씀) */
  var summary = halls.length ? para(firstTwo) : sentence(sec.summary.normal);
  if (abnormal(op)) summary = para([summary, parts[parts.length - 1]]);
  return {
    check: FMT.checkMark + (sel.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing),
    slots: [{id:"main", label:"", text:text}],
    summary: summary,
    alerts: pAlerts
  };
};

/* ---------- 7) 사고 ---------- */
BUILD.thought = function(c, sec){
  var O = sec.outputs;

  /* (1) 사고 형태 */
  var form = c.opt("form");
  var formItems = c.optsOrdered("form_items");
  var line1 = fill(O.form_line, {
    status: form ? (form.en || form.ko) : UI.missing,
    items: form && form.normal ? O.form_normal_check
           : (formItems.map(function(o){ return o.en || o.ko; }).join(", ") || UI.missing)
  });

  /* (3) 망상 — 먼저 계산 (사고 내용 체크 안내에 반영) */
  var del = c.opt("delusion");
  var delTexts = [], delChecks = [], delLead = "", shLead = "";
  if (abnormal(del)){
    var keys = INST["thought/delusion"] || ["0"];
    keys.forEach(function(k){
      var f = frameCtx("thought", "delusion", "#" + k);
      var ty = f.opt("type");
      if (ty && ty.mhis) delChecks.push(ty.mhis);
      var sub = [];
      /* [v2.1] 대상자 표현 끝의 마침표는 뗀다 — 따옴표 안에 남으면 '…한다.'고 처럼 어색해진다 */
      var content = midText(unquote(f.txt("content"))), cv = f.opt("conviction");
      /* [v2.0.1] 확신이 굳지 않으면 '있음'으로 단정하지 않고 '의심' 꼴로 연다 */
      var unsure = !!(cv && (cv.id === "shaky" || cv.id === "ambivalent"));
      var lead;
      if (ty && ty.lead_override){
        /* [v2.1] '기타' 유형은 "기타망상"이 되지 않게 통째로 갈아 끼운다 (의심 꼴도 따로 있음) */
        lead = (unsure && ty.lead_override_unsure) ? ty.lead_override_unsure : ty.lead_override;
      } else if (!ty){
        /* [v2.1] 유형을 고르지 않았으면 유형 자리를 비우지 않고 [미입력] 로 남긴다 */
        lead = fill(unsure && O.delusion_lead_notype_unsure ? O.delusion_lead_notype_unsure : O.delusion_lead_notype,
                    {missing: UI.missing});
      } else {
        lead = fill(unsure && O.delusion_lead_unsure ? O.delusion_lead_unsure : O.delusion_lead, {type: ty.noun});
      }
      sub.push(lead);
      if (content){
        var da = /다$/.test(content.replace(/[)\]}'"”’\s.]+$/,""));
        sub.push(fill(da ? O.delusion_belief_da : O.delusion_belief, {content:content, conviction: cv ? cv.noun : ""}));
      }

      var onset = f.txt("onset");
      /* [v2.1] 행동 영향이 여러 개면 앞의 것은 연결형(mid), 마지막만 종결형(end).
         '기타'를 고르고 칸을 비웠으면 문장을 지우지 말고 [미입력] 로 남긴다 */
      var impTx = midText(f.txt("impact_text"));
      var imp = joinFrags(pickAbnormal(f.optsOrdered("impact")).map(function(o){
        var useNo = !!(o.reveal && !impTx);
        return {
          mid: fill(useNo ? (o.mid_notext || o.mid) : o.mid, {text:impTx, missing:UI.missing}),
          end: fill(useNo ? (o.end_notext || o.end) : o.end, {text:impTx, missing:UI.missing})
        };
      }));
      if (onset && imp) sub.push(fill(O.delusion_onset, {onset:onset, impact:imp}));
      else if (onset) sub.push(fill(O.delusion_onset_only, {onset:onset}));
      else {
        if (imp) sub.push(fill(O.delusion_impact_only, {impact:imp}));
        /* [v2.1] 묻지 못한 시작 시기를 조용히 빼지 않는다 */
        if (O.delusion_onset_unknown) sub.push(fill(O.delusion_onset_unknown, {missing: UI.missing}));
      }
      if (!delLead) delLead = sub[0];
      /* [v2.0.1] 유보 문장은 맨 끝 — 앞 문장의 '이로 인해'가 유보를 받지 않게 */
      if (unsure && O.delusion_uncertain) sub.push(O.delusion_uncertain);
      delTexts.push(para(sub));
    });
  }

  /* (2) 사고 내용 */
  var ca = c.opt("content_abn");
  var citems = c.optsOrdered("content_items");
  var citemChecks = citems.map(function(o){ return o.en || o.ko; });
  var contentYes = (ca && !ca.normal) || abnormal(del);
  var allChecks = [];
  citemChecks.concat(delChecks).forEach(function(x){ if (x && allChecks.indexOf(x) < 0) allChecks.push(x); });
  var line2 = contentYes
    ? (allChecks.length ? fill(O.content_yes_list, {list:allChecks.join(", ")}) : O.content_yes)
    : O.content_no;

  /* (4) 자·타해 사고 */
  var sh = c.opt("selfharm");
  var shText, alerts = [], siYes = false;
  if (!abnormal(sh)) shText = O.selfharm_none;
  else {
    var f2 = frameCtx("thought", "selfharm", "");
    var sub2 = [];
    var shRisk = [];        /* [v1.6] 요약문에서 잘리면 안 되는 위험 조각 */
    function keepRisk(t){ if (t) { sub2.push(t); shRisk.push(t); } }
    function protectiveFrag(){
      var p = f2.txt("protective");
      return p ? fill(O.protective, {list:joinKo(p.split(/[,、·/]+/).map(function(x){ return x.trim(); }).filter(Boolean))}) : "";
    }
    var si = f2.opt("si");
    if (si && !si.normal){
      siYes = true;
      var st = unquote(f2.txt("si_text")), fq2 = f2.opt("si_freq");
      if (st){
        var da2 = /다$/.test(st.replace(/[)\]}'"”’\s.]+$/,""));
        keepRisk(fill(da2 ? O.si_lead_da : O.si_lead, {text:st, freq: fq2 ? fq2.noun : ""}));
      /* [v1.7] 대상자 표현이 없어도 고른 빈도는 버리지 않는다 */
      } else keepRisk(fq2 ? fill(O.si_plain_freq, {freq: fq2.noun}) : O.si_plain);
      var pl = f2.opt("plan"), me = f2.opt("means"), it = f2.opt("intent");
      var itS = it ? (fill(O.intent, {noun:it.noun}) + (f2.txt("intent_text") ? fill(O.intent_quote, {text:f2.txt("intent_text")}) : "")) : "";
      /* [v1.6] 고르지 않은 위험 항목은 '부인함'으로 단정하지 않고 [미입력] 로 남긴다 */
      var unasked = [];
      function ask(gid, o){ if (!o) { var g = f2.group(gid); unasked.push(g ? (g.label || gid) : gid); } }
      ask("plan", pl); ask("means", me); ask("intent", it);
      if (pl && pl.normal && me && me.normal){
        keepRisk(itS ? O.plan_means_none + " " + itS : O.plan_means_none_end);
      } else {
        /* 여러 조각이 이어지면 앞의 것은 연결형을 쓴다 */
        var pm = [];
        /* [v1.7] 물어서 '없음'을 고른 것도 기록에 남긴다. 한쪽만 '없음'일 때 그 부인이 통째로 빠지던 것을 막음 */
        /* [v2.1] 계획 '있음'인데 내용 칸이 비면 '구체적으로 계획을 언급하며,' 라는 비문이 나갔다. 위험 신호는 남기고 내용은 [미입력] 로 적는다 */
        if (pl && !pl.normal){
          var ptx = f2.txt("plan_text");
          if (ptx) pm.push({mid:fill(O.plan_yes_mid, {text:ptx}), end:fill(O.plan_yes, {text:ptx})});
          else pm.push({mid:fill(O.plan_yes_notext_mid, {missing:UI.missing}), end:fill(O.plan_yes_notext, {missing:UI.missing})});
        }
        else if (pl) pm.push({mid:O.plan_none_mid, end:O.plan_none_end});
        if (me && !me.normal) pm.push({mid:O.means_yes_mid, end:O.means_yes});
        else if (me) pm.push({mid:O.means_none_mid, end:O.means_none_end});
        if (itS) pm.push({mid:itS, end:itS});
        if (pm.length) keepRisk(joinFrags(pm));
      }
      var pa = f2.opt("past");
      /* [v2.1] 시기·횟수 칸이 비면 '과거 시도력.' 이라는 토막 문장이 나갔다 */
      if (pa && !pa.normal) keepRisk(f2.txt("past_text")
        ? fill(O.past_yes, {text:f2.txt("past_text")})
        : fill(O.past_yes_notext, {missing:UI.missing}));
      else if (pa) sub2.push(O.past_no);
      else ask("past", null);
      ask("si_freq", fq2);
      if (unasked.length) keepRisk(fill(O.si_unasked, {missing: UI.missing, list: unasked.join("·")}));
      var pr = protectiveFrag();
      if (pr) sub2.push(pr);
      alerts.push(O.alert_si);
    } else {
      sub2.push(si ? O.si_no : fill(O.si_unknown, {missing:UI.missing}));
      /* [v1.6] 자살사고를 '없음'으로 되돌려도 적어 둔 계획·수단·과거 시도력은 버리지 않는다 */
      var kept = [];
      var pl0 = f2.opt("plan"), me0 = f2.opt("means"), pa0 = f2.opt("past");
      /* [v2.1] 자살사고를 '없음'으로 되돌린 경우에도 내용 없는 계획은 [미입력] 로 남긴다 */
      if (pl0 && !pl0.normal) kept.push(f2.txt("plan_text")
        ? fill(O.plan_yes, {text:f2.txt("plan_text")})
        : fill(O.plan_yes_notext, {missing:UI.missing}));
      if (me0 && !me0.normal) kept.push(O.means_yes);
      if (pa0 && !pa0.normal) kept.push(f2.txt("past_text")
        ? fill(O.past_yes, {text:f2.txt("past_text")})
        : fill(O.past_yes_notext, {missing:UI.missing}));
      if (kept.length){
        var pr0 = protectiveFrag();
        if (pr0) kept.push(pr0);
        sub2 = sub2.concat(kept);
        shRisk = shRisk.concat([sub2[0]]).concat(kept);
        alerts.push(O.alert_si_history);
      }
    }
    var hi = f2.opt("hi");
    if (hi && !hi.normal){
      /* [v2.1] 대상·내용 칸이 비면 '타해사고 있음.' 만 남던 것을 막는다 */
      keepRisk(f2.txt("hi_text")
        ? fill(O.hi_yes, {text:f2.txt("hi_text")})
        : fill(O.hi_yes_notext, {missing:UI.missing}));
      alerts.push(O.alert_hi);            /* [v1.6] 타해사고에도 붉은 띠 */
    }
    else if (hi) sub2.push(O.hi_no);
    else keepRisk(fill(O.hi_unknown, {missing:UI.missing}));
    if (!si && shRisk.indexOf(sub2[0]) < 0) shRisk.unshift(sub2[0]);
    /* [v1.6] 요약문은 첫 문장만 자르지 않고 위험 조각을 모두 싣는다 */
    shLead = shRisk.length ? para(shRisk) : (sub2[0] || "");
    shText = para(sub2);
  }

  /* [v2.0] (4)-2 학대·방임 의심 — 신고 의무 */
  var abuseSel = pickAbnormal(c.optsOrdered("abuse"));
  var abuseLine = "";
  if (abuseSel.length){
    var abT = midText(c.txt("abuse_text"));
    abuseLine = fill(abT ? O.abuse_line : O.abuse_line_notext,
                     {list: joinKo(abuseSel.map(function(o){ return o.noun || o.ko; })), text: abT, missing: UI.missing});
    alerts.push(O.alert_abuse);
  }

  /* (5) 기타 */
  var etc = [];
  if (abuseLine) etc.push(abuseLine);
  citems.forEach(function(o){
    var t = c.txt("ci_" + o.id + "_text");
    if (t) etc.push(fill(O.etc_item, {label:o.ko, text:t}));
  });
  var fex = c.txt("form_text");
  if (fex) etc.push(fill(O.form_example, {text:fex}));
  var et = c.txt("etc_text");
  if (et) etc.push(et);

  var delText = abnormal(del) ? para(delTexts) : O.delusion_none;
  var summary = (form && form.normal && !abnormal(del) && !abnormal(sh) && !contentYes && !abuseLine)
    ? sentence(sec.summary.normal)
    : para([
        /* 부적절만 고르고 (1)-2 이상 항목을 하나도 안 고른 경우, 요약에서 조용히 빼지 않고 [미입력] 로 남긴다 */
        (form && !form.normal)
          ? (formItems.length
              ? fill(O.form_summary, {list:formItems.map(function(o){ return o.ko; }).join(", ")})
              : fill(O.form_summary_missing, {missing:UI.missing}))
          : "",
        abnormal(del) ? delLead : O.delusion_none,
        abnormal(sh) ? shLead : O.selfharm_none,
        abuseLine
      ].filter(Boolean));

  /* [v1.6] 자·타해 지시 명령 환청이 6) 지각에 있으면 사고 카드에도 알린다 */
  if (commandRiskSignature()) alerts.push(O.alert_command_here);

  var delStatus = abnormal(del) ? O.status_impaired : O.status_intact;
  var shStatus = abnormal(sh) ? O.status_impaired : O.status_intact;
  return {
    check: line1 + " " + line2,
    checkPanel: line1 + " " + line2 + " / " + fill(O.check_tail, {del:delStatus, sh:shStatus}),
    meta: { delStatus: delStatus, shStatus: shStatus },
    slots: [
      {id:"delusion", label:O.slot_delusion, text:sentence(delText)},
      {id:"selfharm", label:O.slot_selfharm, text:sentence(shText)},
      {id:"etc",      label:O.slot_etc,      text:para(etc)}
    ],
    summary: summary,
    alerts: alerts
  };
};

/* ---------- 8) 인지 ---------- */
var COG_ITEMS = ["ori_time","ori_place","ori_person","mem_remote","mem_recent","mem_immediate","concentration","abstract"];
BUILD.cognition = function(c, sec){
  var O = sec.outputs;
  function st(gid){ var o = c.opt(gid); return o ? (o.ko || o.id) : UI.missing; }
  function lab(gid){ var g = c.group(gid); return (g && g.mhis_label) || gid; }
  function grpLine(groupName, ids){
    var same = ids.every(function(g){ return st(g) === st(ids[0]); });
    if (same) return fill(O.group_same, {group:groupName, labels:ids.map(lab).join("·"), status:st(ids[0])});
    return groupName + " " + ids.map(function(g){ return fill(O.group_item, {label:lab(g), status:st(g)}); }).join("·");
  }
  var chk = [
    grpLine(O.ori_group, ["ori_time","ori_place","ori_person"]),
    grpLine(O.mem_group, ["mem_remote","mem_recent","mem_immediate"]),
    fill(O.group_item, {label:lab("concentration"), status:st("concentration")}),
    fill(O.group_item, {label:lab("abstract"), status:st("abstract")})
  ].join(O.sep);

  var slots = [], impaired = [];
  COG_ITEMS.forEach(function(gid){
    var o = c.opt(gid);
    if (o && !o.normal){
      var t = c.txt(gid + "_text");
      var s = fill(O.item, {label:lab(gid), text:t});
      impaired.push(s);
      slots.push({id:gid, label:lab(gid), text:sentence(s)});
    }
  });
  var meth = c.optsOrdered("method").map(function(o){ return o.ko; });
  var methS = meth.length ? fill(O.method, {list:meth.join(", ")}) : "";
  var summary = impaired.length ? para(impaired.concat(methS ? [methS] : [])) : sentence(sec.summary.normal + methS);
  return { check: chk + (methS ? " " + methS : ""), slots: slots, summary: summary, alerts: [] };
};

/* ---------- 9) 판단력 ---------- */
BUILD.judgment = function(c, sec){
  var O = sec.outputs;
  var j = c.opt("judgment");
  var parts = [], summary;
  if (!j || j.normal){
    parts.push(O.intact);
    summary = sentence(sec.summary.normal);
  } else {
    parts.push(O.impaired_lead);
    /* 실제 사례를 적었으면 그대로, 안 적었으면 고른 영역으로 대신함 */
    var act = midText(c.txt("judgment_actual"));
    var areas = c.optsOrdered("judgment_area").map(function(o){ return o.noun || o.ko; });
    /* 영역과 실제 사례를 둘 다 적었으면 둘 다 남긴다 (한쪽이 버려지지 않도록) */
    if (areas.length) parts.push(fill(act ? O.area_actual : O.area_only, {list:joinKo(areas)}));
    if (act) parts.push(act);
    /* 대상자가 그 결정을 어떻게 설명했는지 */
    var q = unquote(midText(c.txt("judgment_quote")));
    if (q) parts.push(fill(O.quote, {text:q}));
    /* 가상 상황 질문 답변 */
    var h = midText(c.txt("judgment_hypo"));
    if (h) parts.push(fill(O.hypo, {text:h}));
    /* 어떤 양상인지 */
    var pats = c.optsOrdered("judgment_pattern");
    if (pats.length) parts.push(joinFrags(pats));
    summary = sentence(O.impaired_lead);
  }

  return {
    check: j ? (j.ko || j.id) : UI.missing,
    meta: { status: j ? (j.ko || j.id) : UI.missing },
    slots: [{id:"main", label:"", text:para(parts)}],
    summary: summary,
    alerts: []
  };
};

/* ---------- 10) Insight ---------- */
BUILD.insight = function(c, sec){
  var O = sec.outputs;
  var g = c.opt("insight");
  if (!g) return { check:UI.missing, slots:[], summary:UI.missing, alerts:[] };
  var q = c.txt("insight_text");
  var summary = q
    ? sentence(fill(O.summary_long, {roman:g.ko, frag:g.summary_frag}) + fill(O.summary_quote, {text:q}))
    : sentence(fill(O.summary_short, {roman:g.ko}));
  return {
    check: fill(O.check, {roman:g.ko}) + " — " + g.mhis_text,
    slots: [],
    summary: summary,
    alerts: []
  };
};

/* ============================================================
   전체 조립
   ============================================================ */
/* content.js 의 option.force 를 적용한다 (예: 망상 '있음' → 사고 내용 '유') */
function applyLinks(){
  CONTENT.sections.forEach(function(sec){
    (sec.groups || []).forEach(function(g){
      var v = V[sec.id + "/" + g.id];
      (g.options || []).forEach(function(o){
        if (!o.force) return;
        var on = (g.type === "multi") ? ((v || []).indexOf(o.id) >= 0) : (v === o.id);
        if (!on) return;
        var tk = sec.id + "/" + o.force.group;
        var tg = (sec.groups || []).filter(function(x){ return x.id === o.force.group; })[0];
        if (!tg) return;
        if (tg.type === "multi"){
          var cur = V[tk] || [];
          if (cur.indexOf(o.force.option) < 0) V[tk] = cur.filter(function(id){
            var oo = tg.options.filter(function(x){ return x.id === id; })[0];
            return oo && !oo.normal;
          }).concat([o.force.option]);
        } else V[tk] = o.force.option;
      });
    });
  });
}

function inputSignature(sid){
  var values = Object.keys(V).filter(function(k){return k.indexOf(sid + "/") === 0;}).sort().map(function(k){return [k,V[k]];});
  var frames = Object.keys(INST).filter(function(k){return k.indexOf(sid + "/") === 0;}).sort().map(function(k){return [k,INST[k]];});
  var dependency = sid === "thought" ? Object.keys(V).filter(function(k){return k.indexOf("perception/")===0;}).sort().map(function(k){return [k,V[k]];}) : [];
  return JSON.stringify([values,frames,V["appearance/contact_mode"],dependency]);
}
function narrativeVisible(prefix,g){
  return (g.narrativeWhen||[]).every(function(rule){var value=V[prefix+'/'+rule.group];var values=Array.isArray(value)?value:[value];return values.some(function(id){return rule.in.indexOf(id)>=0;});});
}
function buildAll(){
  applyLinks();
  var out = {}, live = {};
  CONTENT.sections.forEach(function(sec){
    var signature = inputSignature(sec.id), cache = BUILD_CACHE[sec.id];
    if (!cache || cache.signature !== signature) {
      cache = {signature:signature, value:BUILD[sec.id](ctxFor(sec.id, sec.groups),sec)};
      BUILD_CACHE[sec.id] = cache;
    }
    var b = Object.assign({},cache.value);
    var context=ctxFor(sec.id,sec.groups);
    var observationGroup = context.group('observations');
    var observations = observationGroup && showIfOk(sec.id,observationGroup) ? context.optsOrdered('observations') : [];
    sec.groups.filter(function(g){return g.clinicalNarrative && narrativeVisible(sec.id,g);}).forEach(function(g){observations=observations.concat(context.optsOrdered(g.id));});
    if(observations.length) b.slots=(b.slots||[]).concat([{id:'observations',label:'추가 관찰·진술 (기관 기록 위치 확인)',text:para(observations.map(function(o){return sentence(o.narrative);}))}]);
    /* 어느 항목에서든 적을 수 있는 '기타 의견'. 있으면 따로 한 칸으로 나온다 */
    var op = String(V[sec.id + "/opinion"] == null ? "" : V[sec.id + "/opinion"]).trim();
    if (op) b.slots = (b.slots || []).concat([{ id:"opinion", label:UI.opinionLabel, text:opinionText(op,V[sec.id+'/opinion_source'],V[sec.id+'/opinion_time']) }]);
    b.slots = (b.slots || []).map(function(s){
      var k = sec.id + ":" + s.id;
      var gen = s.text;
      if (EDIT.hasOwnProperty(k)) return {id:s.id, label:s.label, text:EDIT[k], gen:gen, edited:true, stale:EDIT_BASE.hasOwnProperty(k) && EDIT_BASE[k] !== gen};
      return {id:s.id, label:s.label, text:gen, gen:gen, edited:false};
    });
    b.slots.forEach(function(s){ live[sec.id + ":" + s.id] = true; });
    out[sec.id] = b;
  });
  /* 잠시 숨겨진 칸의 편집은 세션 안에서 유지한다. 살아 있는 칸만 반환하므로 출력에는 섞이지 않는다. */
  return out;
}
function slotText(built, sid, slotId){
  var b = built[sid];
  for (var i=0;i<b.slots.length;i++) if (b.slots[i].id === slotId) return b.slots[i].text;
  return "";
}
function commandRiskSignature(){
  if ((V['perception/hallucination']||[]).indexOf('auditory') < 0) return null;
  var context=frameCtx('perception','hallu','@auditory'),command=context.opt('command');
  return command && !command.normal ? [command.id,context.txt('command_text')] : null;
}
function calendarDateValid(value){
  var match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if(!match)return false;
  var year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);
  if(year<1||month<1||month>12)return false;
  var leap=year%4===0&&(year%100!==0||year%400===0);
  return day>=1&&day<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][month-1];
}
function today(){
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
/* [v2.1] 머리글 날짜 — 면담 날짜 칸이 비어 있거나 모양이 틀리면 오늘 */
function interviewDate(){
  var d = String(V["appearance/interview_date"] == null ? "" : V["appearance/interview_date"]).trim();
  return calendarDateValid(d) ? d : today();
}
/* 6.2 전체 복사 형식 — 줄 모양은 CONTENT.format 에서 옴 */
function fullText(built){
  var L = [fill(FMT.header, {date:interviewDate()})];
  (FMT.lines || []).forEach(function(row){
    var b = built[row.sec];
    if (!b) return;
    var meta = b.meta || {};
    function expand(tpl){
      return String(tpl).replace(/\{(check|status|delStatus|shStatus|slot:[a-z]+)\}/g, function(m, key){
        if (key === "check") return b.check;
        if (key.indexOf("slot:") === 0) return slotText(built, row.sec, key.slice(5)) || UI.none;
        return meta[key] == null ? "" : meta[key];
      });
    }
    L.push(expand(row.head));
    if (row.slot) L.push(slotText(built, row.sec, row.slot));
    (row.sub || []).forEach(function(t){ L.push(expand(t)); });
    if (row.slots) b.slots.forEach(function(s){ if (s.id !== "opinion" && s.id !== "observations") L.push(s.text); });
    var detail=slotText(built,row.sec,'observations');
    if(detail) L.push(' - 추가 관찰·진술: '+detail);
    var op = slotText(built, row.sec, "opinion");
    if (op) L.push(fill(FMT.opinionLine, {text:op}));
  });
  return L.join("\n");
}
/* [v2.0] MHIS 에 옮겨 적을 단계 목록 — 탭 순서대로 '체크할 것'과 '붙여넣을 것'을 나눈다 */
function transferSteps(built){
  var steps = [];
  (FMT.lines || []).forEach(function(row){
    var b = built[row.sec];
    if (!b) return;
    var sec = SEC[row.sec];
    var tab = sec ? (sec.order + ") " + sec.title_ko) : row.sec;
    var meta = b.meta || {};
    function expand(tpl){
      return String(tpl).replace(/\{(check|status|delStatus|shStatus|slot:[a-z]+)\}/g, function(m, key){
        if (key === "check") return b.check;
        if (key.indexOf("slot:") === 0) return slotText(built, row.sec, key.slice(5)) || UI.none;
        return meta[key] == null ? "" : meta[key];
      });
    }
    /* [v2.0.1] 체크 단계에는 서술문을 넣지 않는다 (서술문은 바로 다음 붙여넣기 단계에서 나감) */
    var headTxt = expand(String(row.head).replace(/\s*\/\s*\{slot:[a-z]+\}/g, ""));
    if (b.check || b.checkPanel || /\{status\}/.test(row.head)){
      steps.push({ key: row.sec + ':check', tab: tab, kind: "check", text: (b.checkPanel ? UI.checkLead + b.checkPanel : headTxt) });
    }
    b.slots.forEach(function(s){
      if (!String(s.text || "").trim()) return;

      steps.push({ key: row.sec + ':slot:' + s.id, tab: tab, kind: "paste", field: (s.label || UI.slotDefault), text: s.text });
    });
  });

}

function summaryText(built){

/* Insight 질문 흐름 */
/* [v2.1] 등급에서 답 경로를 거꾸로 찾는다 — 예시 대상자를 불러온 뒤 질문 흐름이 결과와 어긋나지 않도록 */
function presetFlow(flow, grade){
  var picked = {};
  function walk(idx){
    var step = flow[idx]; if (!step) return false;
    for (var i = 0; i < step.a.length; i++){
      var a = step.a[i];
      if (a.grade === grade){ picked[idx] = i; return true; }
      if (a.grade == null && a.next != null && walk(a.next)){ picked[idx] = i; return true; }
    }
    return false;
  }
  if (!grade || !flow || !walk(0)) return null;
  var last = 0;
  Object.keys(picked).forEach(function(k){ if (Number(k) > last) last = Number(k); });
  return {step:last, picked:picked};
}
function renderFlow(host, sec, prefix, g){
  var grade = V[prefix + "/insight"] || "";
  var state = presetFlow(g.flow, grade) || {step:0, picked:{}};
  host._syncFlow = function(){
    var next = V[prefix + "/insight"] || "";
    if (next === grade) return;
    grade = next;
    state = presetFlow(g.flow, grade) || {step:0, picked:{}};
    draw();
  };
  var box = el("div");
  host.appendChild(box);
  function draw(){
    box.innerHTML = "";
    for (var i = 0; i <= state.step && i < g.flow.length; i++){

    list.replaceChildren();
    if (loaded && !items.length) list.appendChild(el('div', 'mse-tools-empty', '저장된 대상자 기록이 없습니다. 작성 후 [기록 저장]으로 보관하세요.'));
    else if (loaded && !shown.length) list.appendChild(el('div', 'mse-tools-empty', '일치하는 기록이 없습니다. 다른 글자로 찾아보세요.'));
    shown.forEach(i => list.appendChild(row(i)));
  }
  function render() { if (tab === 'save') renderSave(); else renderOpen(); }
  function setTab(next) {
    tab = next;
    Object.keys(panes).forEach(id => { panes[id].hidden = id !== next; tabButtons[id].setAttribute('aria-selected', String(id === next)); tabButtons[id].tabIndex = id === next ? 0 : -1; });
    render();
  }
  function open(next) {
    if (!usable()) { tools.notify(host.pending ? ERRORS.pending : ERRORS.disabled); return; }
    if (!dialog.open) lastFocus = document.activeElement;
    if (next === 'save') { nameInput.value = current ? current.label : ''; target = 'update'; }
    say(''); setTab(next);
    if (!dialog.open) dialog.showModal();
    if (next === 'save') { nameInput.focus(); nameInput.select(); } else (items.length ? search : tabButtons.open).focus();
    refreshList();
  }
  function close() {
    dialog.close();
    if (lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus();
  }
  function refreshList() {
    return store.list().then(() => {
      if (current && !items.some(i => i.id === current.id)) current = null;
      sync(); if (dialog.open && tab === 'open') renderOpen();
    }, err => { loaded = true; say(errorText(err), true); render(); });
  }

  /* ---------- 저장 · 열기 · 삭제 ---------- */
  function saveRecord() {
    const label = cleanLabel(nameInput.value), state = window.__mseCaptureState();
    if (busy || !usable()) return;
    if (state.example) { say(exampleNote.textContent, true); return; }
    if (!label) { say(ERRORS.label, true); nameInput.focus(); return; }
    const json = JSON.stringify(state);
    if (!validState(json)) { say(ERRORS.invalid, true); return; }
    const info = interviewInfo(state), existing = matchTarget(label, info.interviewDate);
    const id = existing && target === 'update' ? existing.id : '';
    busy = true; renderSave(); say('암호화해 저장하는 중…');
    store.save(id, label, info, json).then(meta => {
      current = Object.assign({}, meta, { signature: signature(state) });
      busy = false; close(); refreshList();
      tools.notify('‘' + current.label + '’ 기록을 저장했습니다 · ' + shortTime(current.savedAt));
    }, err => {
      busy = false; say(errorText(err), true);
      if (err.code === 'notfound') { current = null; refreshList(); }
      renderSave();
    });
  }
  function openRecord(item) {
    if (busy) return;
    if (current && current.id === item.id && !changed()) { close(); tools.notify('‘' + item.label + '’ 기록이 이미 열려 있습니다.'); return; }
    if (unsavedWork()) {
      const message = current
        ? '‘' + current.label + '’ 기록에 저장하지 않은 수정 내용이 있습니다. 다른 기록을 불러오면 이 수정 내용은 사라집니다. 계속할까요?'
        : '지금 작성 중인 내용은 대상자 기록으로 저장되지 않았습니다. 기록을 불러오면 현재 화면의 내용이 바뀝니다. 계속할까요?';
      if (!confirm(message)) return;
    }
    busy = true; say('‘' + item.label + '’ 기록을 여는 중…');
    store.open(item.id).then(res => {
      busy = false;
      let state = null;
      try { state = validState(res.state) ? JSON.parse(res.state) : null; } catch (_) { state = null; }
      if (state) { state.dirty = false; state.example = false; }
      if (!state || !window.__mseRestoreState(state)) { say(ERRORS.invalid, true); return; }
      current = Object.assign({}, res.item, { signature: signature() });
      pushHostState(); close(); sync();
      tools.notify('‘' + current.label + '’ 기록을 불러왔습니다 · 면담 ' + (current.interviewDate || '') + '. 기록 검토에서 문장을 확인하세요.');
    }, err => { busy = false; say(errorText(err), true); if (err.code === 'notfound') refreshList(); });
  }
  function deleteRecord(item) {
    if (busy || !confirm('‘' + item.label + '’ 기록(면담 ' + (item.interviewDate || '—') + ')을 이 PC에서 삭제할까요? 삭제한 기록은 되돌릴 수 없습니다.')) return;
    busy = true;
    store.remove(item.id).then(() => {
      busy = false;
      if (current && current.id === item.id) current = null;
      items = items.filter(i => i.id !== item.id);
      sync(); renderOpen(); say('‘' + item.label + '’ 기록을 삭제했습니다. 현재 화면의 내용은 그대로입니다.');
      const first = list.querySelector('.mse-tools-go'); (first || (search.hidden ? tabButtons.open : search)).focus();
    }, err => { busy = false; say(errorText(err), true); refreshList(); });
  }

  const box = document.getElementById('draftRecovery');
  if (box) host.enabled = !!box.checked;
  sync();
  window.MSERecords = { open: open, current: () => current && { id: current.id, label: current.label, savedAt: current.savedAt } };
})();

</script>
</body>
</html>
